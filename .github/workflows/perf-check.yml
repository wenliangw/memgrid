name: Perf & Size Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  bundle-size:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - name: Bundle size
        run: |
          echo "### Dist Size"
          du -sh dist/
          echo ""
          echo "### Largest Files"
          find dist -name "*.js" -exec du -h {} \; | sort -rh | head -10

      - name: Test count
        run: |
          echo "### Test Files"
          ls tests/*.test.ts | wc -l
          echo ""
          npx vitest run --reporter=json 2>/dev/null > /tmp/vitest-output.json || true
          node -e "
            try {
              const data = JSON.parse(require('fs').readFileSync('/tmp/vitest-output.json','utf-8'));
              console.log('Tests:', data.numPassedTests || data.testResults?.reduce((s,r) => s + r.assertionResults.length, 0) || 'N/A');
            } catch(e) { console.log('N/A'); }
          "

      - name: Performance benchmarks
        run: |
          echo "### Perf Benchmarks"
          pnpm vitest run tests/perf.test.ts --reporter=verbose 2>&1 | grep -E "✓|PASS|FAIL|ms$"
